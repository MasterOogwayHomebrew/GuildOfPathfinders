    },600);
  },{passive:true});
  document.addEventListener('touchmove',()=>{ clearTimeout(_tTimer); _tTimer=null; },{passive:true});
  document.addEventListener('touchend',()=>{ clearTimeout(_tTimer); _tTimer=null; },{passive:true});
  // suppress native contextmenu on touch so we don't double-fire
  document.addEventListener('contextmenu',e=>{
    if(_tFired){ e.preventDefault(); _tFired=false; }
  });
})();

/* ============================================================
   COMPENDIUM
   ============================================================ */
const SK_COMP = 'guild-comp-v1';
let COMP = { categories: [], entries: [], nextId: 1 };
let compView = 'type'; // 'type' | 'name' | 'level'
let compSearch = '';
let compFilters = { catId: '', level: '', source: '' };
let compDragMode = false;
let compOpenId = null;
let compDetailEdit = false; // false = view mode, true = edit mode
let compBodyTimer = null;

const DEFAULT_COMP_CATS = [
  { id: 'origin',     name: 'Черта происхождения',      icon: '⚙', color: '#5a8a5a', order: 0 },
  { id: 'dark',       name: 'Тёмный дар',               icon: '🦇', color: '#7a4aaa', order: 1 },
  { id: 'dragonmark', name: 'Черта Драконьей метки',    icon: '✦', color: '#aa6a2a', order: 2 },
  { id: 'universal',  name: 'Универсальная черта',       icon: '❋', color: '#3a6aaa', order: 3 },
  { id: 'combat',     name: 'Боевой стиль',             icon: '⚔', color: '#aa3a3a', order: 4 },
  { id: 'epic',       name: 'Эпический дар',            icon: '✵', color: '#aaaa2a', order: 5 },
  { id: 'feat',       name: 'Подвиг',                   icon: '🏆', color: '#3aaa6a', order: 6 },
  { id: 'maneuver',   name: 'Приём',                    icon: '⚡', color: '#3a6aaa', order: 7 },
];

async function loadComp() {
  try {
    const doc = await db.collection('data').doc('compendium').get();
    if (doc.exists && doc.data()) {
      COMP = doc.data();
    }
  } catch(e) { console.warn('Firestore loadComp failed, trying localStorage:', e); }
  // Запасной вариант — localStorage
  if (!COMP.categories || !COMP.categories.length) {
    try {
      const raw = localStorage.getItem(SK_COMP);
      if (raw) {
        COMP = JSON.parse(raw);
        if (isOwner) saveComp(); // мигрируем в Firestore
      }
    } catch(e) {}
  }
  if (!COMP.categories || !COMP.categories.length) COMP.categories = JSON.parse(JSON.stringify(DEFAULT_COMP_CATS));
  if (!COMP.entries) COMP.entries = [];
  if (!COMP.nextId) COMP.nextId = 1;
  COMP.categories.forEach((c,i) => { if (c.order == null) c.order = i; });
}

function saveComp() {
  if (!isOwner) return;
  db.collection('data').doc('compendium').set(JSON.parse(JSON.stringify(COMP))).catch(e => console.error('saveComp failed:', e));
}

function openCompendium() {
  compOpenId = null;
  document.body.classList.add('comp-mode');
  closeMobileSidebar();
  renderCompScreen();
}

function closeCompendium() {
  document.body.classList.remove('comp-mode');
  document.getElementById('comp-settings-panel').classList.remove('open');
}

function renderCompScreen() {
  renderCompTopbar();
  renderCompLegend();
  renderCompBody();
}

/* ---------- TOPBAR ---------- */
function renderCompTopbar() {
  const tb = document.getElementById('comp-topbar');
  const cats = [...COMP.categories].sort((a,b) => a.order - b.order);
  const catOpts = `<option value="">Все категории</option>${cats.map(c => `<option value="${esc(c.id)}"${compFilters.catId===c.id?' selected':''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}`;
  const lvlList = [...new Set(COMP.entries.map(e=>e.level).filter(v=>v!=null))].sort((a,b)=>a-b);
  const hasNull = COMP.entries.some(e=>e.level==null);
  const lvlOpts = `<option value="">Уровень</option>${lvlList.map(v=>`<option value="${v}"${compFilters.level===String(v)?' selected':''}>${v}</option>`).join('')}${hasNull?`<option value="null"${compFilters.level==='null'?' selected':''}>—</option>`:''}`;
  const srcList = [...new Set(COMP.entries.map(e=>e.source||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
  const srcOpts = `<option value="">Источник</option>${srcList.map(s=>`<option value="${esc(s)}"${compFilters.source===s?' selected':''}>${esc(s)}</option>`).join('')}`;
  tb.innerHTML = `
    <button class="comp-back-btn" onclick="closeCompendium()">◀ Классы</button>
    <div class="comp-search-wrap">
      <span class="comp-search-icon">🔍</span>
      <input class="comp-search-inp" placeholder="Поиск по разделу" value="${esc(compSearch)}" oninput="compSearch=this.value;renderCompBody()">
    </div>
    <select class="comp-filter-sel" onchange="compFilters.catId=this.value;renderCompBody()">${catOpts}</select>
    <select class="comp-filter-sel" onchange="compFilters.level=this.value;renderCompBody()">${lvlOpts}</select>
    <select class="comp-filter-sel" onchange="compFilters.source=this.value;renderCompBody()">${srcOpts}</select>
    <button class="comp-search-go" onclick="renderCompBody()">Найти</button>
    <div class="comp-sep"></div>
    <button class="comp-view-btn${compView==='name'?' active':''}" onclick="compView='name';renderCompTopbar();renderCompLegend();renderCompBody()">Название</button>
    <button class="comp-view-btn${compView==='type'?' active':''}" onclick="compView='type';renderCompTopbar();renderCompLegend();renderCompBody()">Тип</button>
    <button class="comp-view-btn${compView==='level'?' active':''}" onclick="compView='level';renderCompTopbar();renderCompLegend();renderCompBody()">Уровень</button>
    <div class="comp-sep"></div>
    <button class="comp-add-btn" onclick="compAddEntry()">+ Добавить</button>
    <button class="comp-drag-btn${compDragMode?' active':''}" onclick="compToggleDrag()" title="Перемещение записей между категориями">${compDragMode?'🔓 Перемещение вкл':'🔒 Переместить'}</button>
    <button class="comp-export-btn" onclick="exportCompendium()" title="Скачать компендиум как JSON">⬇ Компендиум</button>
    <button class="comp-export-btn" onclick="importCompendium()" title="Импортировать компендиум из JSON">⬆ Импорт</button>
    <button class="comp-settings-btn${document.getElementById('comp-settings-panel').classList.contains('open')?' active':''}" onclick="toggleCompSettings()" title="Управление категориями">⚙</button>
  `;
}

/* ---------- LEGEND ---------- */
function renderCompLegend() {
  const el = document.getElementById('comp-type-legend');
  el.style.display = 'none'; // labels now shown as section headers inside body
}

/* ---------- FILTER ---------- */
function compFilterEntries() {
  let list = [...COMP.entries];
  const q = compSearch.trim().toLowerCase();
  if (q) list = list.filter(e => (e.name||'').toLowerCase().includes(q) || (e.nameEn||'').toLowerCase().includes(q) || (e.body||'').replace(/<[^>]+>/g,'').toLowerCase().includes(q));
  if (compFilters.catId) list = list.filter(e => e.catId === compFilters.catId);
  if (compFilters.level) list = list.filter(e => compFilters.level==='null' ? e.level==null : e.level!=null && String(e.level)===compFilters.level);
  if (compFilters.source) list = list.filter(e => e.source === compFilters.source);
  return list;
}

/* ---------- BODY ROUTER ---------- */
function renderCompBody() {
  const el = document.getElementById('comp-body');
  if (compOpenId !== null) { renderCompDetail(compOpenId); return; }
  const entries = compFilterEntries();
  if (compView === 'type')  renderCompByType(el, entries);
  else if (compView === 'name')  renderCompByName(el, entries);
  else renderCompByLevel(el, entries);
  if (compDragMode) setTimeout(initCompEntryDrag, 0);
}

function compGetCat(id) { return COMP.categories.find(c => c.id === id) || { name: id, icon: '?', color: '#888', order: 999 }; }

/* ---------- TYPE VIEW ---------- */
function renderCompByType(el, entries) {
  const cats = [...COMP.categories].sort((a,b) => a.order - b.order);
  let html = '';
  for (const cat of cats) {
    const cEntries = entries.filter(e => e.catId === cat.id).sort((a,b) => (a.order||0)-(b.order||0) || (a.name||'').localeCompare(b.name||'','ru'));
    if (!cEntries.length && (compSearch || compFilters.catId || compFilters.level || compFilters.source)) continue;
    const entriesHtml = cEntries.map(e => compEntryHtml(e, cat)).join('');
    const zoneHtml = compDragMode ? `<div class="comp-drop-zone" data-cat-id="${esc(cat.id)}">⬇ Перетащи сюда</div>` : (!cEntries.length ? `<div class="comp-empty-zone">—</div>` : '');
    html += `<div class="comp-group">
      <div class="comp-group-label" style="color:${cat.color};border-bottom-color:${cat.color}"><span class="cgl-icon">${esc(cat.icon)}</span>${esc(cat.name)}</div>
      <div class="comp-group-entries" id="cgrp-${esc(cat.id)}">${entriesHtml}${zoneHtml}</div>
    </div>`;
  }
  el.innerHTML = html || `<div style="padding:40px;text-align:center;color:var(--muted)">Ничего не найдено</div>`;
}

/* ---------- NAME VIEW ---------- */
function renderCompByName(el, entries) {
  const sorted = [...entries].sort((a,b) => (a.name||'').localeCompare(b.name||'','ru'));
  let html = '<div class="comp-flat-list">';
  let lastLetter = '';
  for (const e of sorted) {
    const letter = (e.name||'#')[0].toUpperCase();
    if (letter !== lastLetter) { html += `<div class="comp-alpha-hdr">${esc(letter)}</div>`; lastLetter = letter; }
    html += compEntryHtml(e, compGetCat(e.catId));
  }
  html += '</div>';
  el.innerHTML = sorted.length ? html : `<div style="padding:40px;text-align:center;color:var(--muted)">Ничего не найдено</div>`;
}

/* ---------- LEVEL VIEW ---------- */
function renderCompByLevel(el, entries) {
  const groups = {};
  for (const e of entries) {
    const k = e.level != null ? String(e.level) : '—';
    if (!groups[k]) groups[k] = [];
    groups[k].push(e);
  }
  const keys = Object.keys(groups).sort((a,b) => { if(a==='—')return 1; if(b==='—')return -1; return Number(a)-Number(b); });
  let html = '';
  for (const k of keys) {
    const sorted = groups[k].sort((a,b) => (a.name||'').localeCompare(b.name||'','ru'));
    html += `<div class="comp-group">
      <div class="comp-group-label" style="color:var(--muted);border-bottom-color:var(--border)">Уровень&nbsp;${esc(k)}</div>
      <div class="comp-group-entries">${sorted.map(e => compEntryHtml(e, compGetCat(e.catId))).join('')}</div>
    </div>`;
  }
  el.innerHTML = html || `<div style="padding:40px;text-align:center;color:var(--muted)">Ничего не найдено</div>`;
}

/* ---------- ENTRY HTML ---------- */
function compEntryHtml(e, cat) {
  return `<div class="comp-entry" data-entry-id="${e.id}" onclick="compOpenEntry(${e.id})" draggable="${compDragMode?'true':'false'}">
    <span class="comp-entry-icon" style="color:${cat.color||'var(--muted)'}">${esc(cat.icon||'?')}</span>
    <span class="comp-entry-name">${esc(e.name||'—')}${e.nameEn?` <span style="color:var(--muted);font-size:0.8em">[${esc(e.nameEn)}]</span>`:''}</span>
    ${e.level!=null?`<span class="comp-entry-lvl">${esc(String(e.level))}</span>`:''}
  </div>`;
}

function compOpenEntry(id) {
  if (compDragMode) return;
  compDetailEdit = false;
  compOpenId = id;
  renderCompBody();
}

/* ---------- DETAIL / EDIT ---------- */

      </div>
      <div class="comp-detail-head">

    el.innerHTML = `<div class="comp-detail">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <button class="comp-detail-back" onclick="compOpenId=null;compDetailEdit=false;renderCompBody()">◀ Назад к списку</button>
        <button class="comp-del-btn" style="margin-left:auto" onclick="compDeleteEntry(${id})">✕ Удалить запись</button>
        <button class="comp-edit-btn" style="border-color:var(--gold);color:var(--gold)" onclick="compDetailEdit=false;renderCompDetail(${id})">✓ Просмотр</button>
      </div>
      <div class="comp-detail-head">
        <div class="comp-detail-name-row">
          <input class="comp-detail-name" value="${esc(e.name||'')}" placeholder="Название" oninput="compUpdEntry(${id},'name',this.value)">
          <input class="comp-detail-nameen" value="${esc(e.nameEn||'')}" placeholder="[English name]" oninput="compUpdEntry(${id},'nameEn',this.value)" style="width:150px">

        <div style="margin-bottom:6px">
          <select class="comp-detail-cat-sel" onchange="compUpdEntry(${id},'catId',this.value)">${catOpts}</select>

          <div class="comp-meta-field">
            <div class="comp-meta-label">Уровень</div>
            <input class="comp-meta-inp" value="${esc(e.level!=null?String(e.level):'')}" placeholder="—" style="width:55px" oninput="compUpdEntry(${id},'level',this.value===''?null:(parseInt(this.value)||null))">
          </div>
          <div class="comp-meta-field">
            <div class="comp-meta-label">Источник</div>
            <input class="comp-meta-inp" value="${esc(e.source||'')}" placeholder="PHB" style="width:80px" oninput="compUpdEntry(${id},'source',this.value)">

          <div class="comp-meta-field" style="flex:1;min-width:100px">
            <div class="comp-meta-label">Владения</div>

          </div>
          <div class="comp-meta-field" style="flex:1;min-width:100px">
            <div class="comp-meta-label">Требования</div>

          </div>
          <div class="comp-meta-field" style="flex:1;min-width:80px">
            <div class="comp-meta-label">Другое</div>

          oncontextmenu="showCtxMenu(event,this);event.preventDefault()"

        >${e.body||''}</div>

function compDebounceSave(el, id) {
  clearTimeout(compBodyTimer);
  compBodyTimer = setTimeout(() => compSaveBody(el, id), 600);
}

function compSaveBody(el, id) {
  clearTimeout(compBodyTimer);
  const e = COMP.entries.find(x => x.id === id); if (!e) return;
  e.body = el.innerHTML; saveComp();
}

function compUpdEntry(id, field, value) {
  const e = COMP.entries.find(x => x.id === id); if (!e) return;
  e[field] = value; saveComp();
}

/* ---------- ADD / DELETE ---------- */
function compAddEntry() {
  const cats = [...COMP.categories].sort((a,b) => a.order - b.order);
  const catId = compFilters.catId || (cats[0] ? cats[0].id : 'origin');
  const id = COMP.nextId++;
  const maxOrd = Math.max(0, ...COMP.entries.filter(e => e.catId === catId).map(e => e.order||0));
  COMP.entries.push({ id, catId, name: 'Новая запись', nameEn: '', level: null, source: '', chars: '', prof: '', req: '', other: '', body: '', order: maxOrd + 1 });
  saveComp(); compOpenId = id; compDetailEdit = true; renderCompBody();
}

function compDeleteEntry(id) {
  if (!confirm('Удалить эту запись?')) return;
  COMP.entries = COMP.entries.filter(e => e.id !== id);
  saveComp(); compOpenId = null; renderCompBody();
}

/* ---------- DRAG ENTRIES ---------- */
function compToggleDrag() {
  compDragMode = !compDragMode;
  renderCompTopbar(); renderCompBody();
}

function initCompEntryDrag() {
  let dragId = null;
  document.querySelectorAll('.comp-entry[draggable="true"]').forEach(el => {
    el.ondragstart = e => { dragId = parseInt(el.dataset.entryId); el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
    el.ondragend = () => { dragId = null; document.querySelectorAll('.comp-entry.dragging,.comp-entry.drag-over,.comp-drop-zone.drag-over').forEach(x => { x.classList.remove('dragging','drag-over'); }); };
    el.ondragover = e => { e.preventDefault(); el.classList.add('drag-over'); };
    el.ondragleave = () => el.classList.remove('drag-over');
    el.ondrop = e => {
      e.preventDefault(); el.classList.remove('drag-over');
      if (dragId == null || dragId === parseInt(el.dataset.entryId)) return;
      const src = COMP.entries.find(x => x.id === dragId);
      const tgt = COMP.entries.find(x => x.id === parseInt(el.dataset.entryId));
      if (!src || !tgt) return;
      src.catId = tgt.catId;
      src.order = (tgt.order||0) - 0.5;
      // re-normalise orders within cat
      const inCat = COMP.entries.filter(x => x.catId === tgt.catId).sort((a,b) => (a.order||0)-(b.order||0));
      inCat.forEach((x,i) => x.order = i);
      saveComp(); renderCompBody();
    };
  });
  document.querySelectorAll('.comp-drop-zone').forEach(zone => {
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
    zone.ondragleave = () => zone.classList.remove('drag-over');
    zone.ondrop = e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      if (dragId == null) return;
      const src = COMP.entries.find(x => x.id === dragId); if (!src) return;
      src.catId = zone.dataset.catId;
      const maxOrd = Math.max(0, ...COMP.entries.filter(x => x.catId === zone.dataset.catId && x.id !== dragId).map(x => x.order||0));
      src.order = maxOrd + 1;
      saveComp(); renderCompBody();
    };
  });
}

/* ---------- CATEGORY SETTINGS ---------- */
function toggleCompSettings() {
  const panel = document.getElementById('comp-settings-panel');
  const isOpen = panel.classList.toggle('open');
  if (isOpen) renderCompSettingsPanel();
  renderCompTopbar();
}

function renderCompSettingsPanel() {
  const panel = document.getElementById('comp-settings-panel');
  const cats = [...COMP.categories].sort((a,b) => a.order - b.order);
  panel.innerHTML = `
    <div class="comp-sp-head">
      <span class="comp-sp-title">Категории компендиума</span>
      <button class="comp-sp-close" onclick="toggleCompSettings()">✕</button>
    </div>
    <div class="comp-cat-list" id="comp-cat-list">
      ${cats.map(c => `
        <div class="comp-cat-item" data-cat-id="${esc(c.id)}" draggable="true">
          <span class="comp-cat-drag-h">⠿</span>
          <input class="comp-cat-icon-inp" value="${esc(c.icon||'')}" maxlength="2" title="Иконка" oninput="compUpdCat('${esc(c.id)}','icon',this.value)">
          <input class="comp-cat-name-inp" value="${esc(c.name||'')}" oninput="compUpdCat('${esc(c.id)}','name',this.value)">
          <input type="color" value="${c.color||'#888888'}" onchange="compUpdCat('${esc(c.id)}','color',this.value)" style="width:22px;height:22px;border:none;cursor:pointer;background:none;padding:0;flex-shrink:0;">
          <button class="comp-cat-del-btn" onclick="compDeleteCat('${esc(c.id)}')">✕</button>
        </div>
      `).join('')}
    </div>
    <button class="comp-add-cat-btn" onclick="compAddCat()">+ Добавить категорию</button>
  `;
  initCompCatDrag();
}

function compUpdCat(id, field, value) {
  const c = COMP.categories.find(x => x.id === id); if (!c) return;
  c[field] = value; saveComp();
  renderCompTopbar(); renderCompLegend();
  if (compOpenId !== null) renderCompDetail(compOpenId); else renderCompBody();
}

function compDeleteCat(id) {
  const cnt = COMP.entries.filter(e => e.catId === id).length;
  if (cnt > 0 && !confirm(`В этой категории ${cnt} записей — они потеряют категорию. Удалить?`)) return;
  COMP.categories = COMP.categories.filter(c => c.id !== id);
  saveComp(); renderCompSettingsPanel(); renderCompTopbar(); renderCompLegend(); renderCompBody();
}

function compAddCat() {
  const id = 'cat_' + Date.now();
  const maxOrd = Math.max(-1, ...COMP.categories.map(c => c.order));
  COMP.categories.push({ id, name: 'Новая категория', icon: '★', color: '#5a6a7a', order: maxOrd + 1 });
  saveComp(); renderCompSettingsPanel(); renderCompTopbar(); renderCompLegend();
}

function initCompCatDrag() {
  const list = document.getElementById('comp-cat-list'); if (!list) return;
  let dragId = null;
  list.querySelectorAll('.comp-cat-item').forEach(el => {
    el.ondragstart = e => { dragId = el.dataset.catId; e.dataTransfer.effectAllowed='move'; setTimeout(()=>el.style.opacity='0.4',0); };
    el.ondragend = () => { dragId=null; el.style.opacity=''; list.querySelectorAll('.comp-cat-item.drag-over').forEach(x=>x.classList.remove('drag-over')); };
    el.ondragover = e => { e.preventDefault(); el.classList.add('drag-over'); };
    el.ondragleave = () => el.classList.remove('drag-over');
    el.ondrop = e => {
      e.preventDefault(); el.classList.remove('drag-over');
      if (!dragId || dragId === el.dataset.catId) return;
      const src = COMP.categories.find(c => c.id === dragId);
      const tgt = COMP.categories.find(c => c.id === el.dataset.catId);
      if (!src || !tgt) return;
      [src.order, tgt.order] = [tgt.order, src.order];
      saveComp(); renderCompSettingsPanel(); renderCompTopbar(); renderCompLegend(); renderCompBody();
    };
  });
}

/* BOOT */
loadScale(); applyScale();
loadFontSize(); applyFontSize();
loadTableFs(); applyTableFs();

async function _boot() {
  applyTheme(); // применяем дефолтные переменные; Firestore перетрёт после загрузки
  loadLayout();
  await Promise.all([load(), loadComp(), loadConfig()]); // loadConfig() применит тему из Firestore
  loadCustomThemes(); // данные уже в customThemes из loadConfig()
  if (classes.length > 0) activeId = classes[0].id;
  renderSidebar();
  renderMain();
  initSidebarDrag();
  if (!isOwner) applyROMode();
  setTimeout(showWelcome, 600);
}

auth.onAuthStateChanged(async function(user) {
  if (_booted) return;
  _booted = true;
  isOwner = !!(user && user.email === OWNER_EMAIL);
  currentUser = user;
  await _boot();
});

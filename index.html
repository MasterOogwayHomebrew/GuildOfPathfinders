<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
:root{--bg:#111428;--sidebar-bg:#171a30;--panel:#1c2038;--panel2:#222640;--border:#313660;--gold:#c9a832;--gold2:#e2ca55;--text:#f5f0e4;--muted:#d8d4c2;--accent:#5272a0;--sub:#7a5aaa;--font:'Calibri','Candara','Segoe UI',Arial,sans-serif;--ui-fs:13px;--table-fs:0.85em;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;font-size:var(--ui-fs);overflow-x:hidden;}

/* SIDEBAR */
.sidebar{width:200px;min-width:200px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden;flex-shrink:0;position:relative;}
.sidebar.no-transition{transition:none!important;}
.sidebar.collapsed{width:36px!important;min-width:36px!important;}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 8px;border-bottom:1px solid var(--border);flex-shrink:0;gap:4px;}
.sidebar-label{font-size:0.77em;letter-spacing:3px;color:var(--text);text-transform:uppercase;white-space:nowrap;overflow:hidden;transition:opacity .15s;font-weight:700;opacity:0.8;}
.sidebar.collapsed .sidebar-label{opacity:0;}
.sidebar-toggle{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:0.92em;padding:2px;flex-shrink:0;line-height:1;transition:color .15s;}
.sidebar-toggle:hover{color:var(--gold);}
.sidebar-search{display:flex;flex-direction:column;gap:4px;padding:8px 8px 6px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar.collapsed .sidebar-search{display:none;}
.sb-search-inp{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-size:0.85em;outline:none;font-family:var(--font);}
.sb-search-inp:focus{border-color:var(--gold);}
.sb-sort-btn{background:transparent;border:1px solid var(--border);color:var(--text);font-size:0.69em;padding:2px 6px;cursor:pointer;font-family:var(--font);letter-spacing:1px;width:100%;transition:all .15s;text-align:left;opacity:0.75;}
.sb-sort-btn:hover,.sb-sort-btn.active{border-color:var(--gold);color:var(--gold);}
.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;}
.sidebar.collapsed .sidebar-body{display:none;}
.class-list{flex:1;}
.cat-folder{margin-bottom:1px;}
.cat-header{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px;cursor:pointer;user-select:none;border-radius:3px;transition:background .1s;}
.cat-header:hover{background:rgba(255,255,255,0.06);}
.cat-header.drag-over{background:rgba(184,152,42,0.15);outline:1px dashed rgba(184,152,42,0.5);}
.cat-chevron{font-size:0.62em;color:var(--muted);width:10px;text-align:center;flex-shrink:0;transition:transform .2s;display:inline-block;}
.cat-header.collapsed .cat-chevron{transform:rotate(-90deg);}
.cat-folder-icon{font-size:0.85em;flex-shrink:0;}
.cat-name{flex:1;font-size:0.85em;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-rename-inp{flex:1;background:var(--panel2);border:1px solid var(--gold);color:var(--text);font-size:0.85em;padding:1px 4px;outline:none;font-family:var(--font);min-width:0;}
.cat-children{padding-left:12px;}
.cat-children.hidden{display:none;}
.class-item{padding:3px 6px 3px 4px;cursor:pointer;display:flex;align-items:center;gap:5px;border-radius:3px;transition:background .1s;overflow:hidden;}
.class-item:hover{background:rgba(255,255,255,0.06);}
.class-item.active{background:rgba(184,152,42,0.13);}
.class-item.drag-over{background:rgba(184,152,42,0.1);outline:1px dashed rgba(184,152,42,0.4);}
.cls-file-icon{font-size:0.77em;color:var(--muted);flex-shrink:0;}
.class-item-name{flex:1;font-size:0.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.class-item-del{font-size:0.77em;color:var(--muted);cursor:pointer;padding:1px 4px;opacity:0;transition:opacity .15s;flex-shrink:0;}
.class-item:hover .class-item-del{opacity:1;}
.class-item-del:hover{color:#c06060;}
.ft-label{display:block;font-size:1em;font-weight:700;}
.ft-hint{display:block;font-size:0.82em;color:var(--muted);font-style:italic;margin-top:1px;opacity:0.8;}
.ab-sl-label{font-size:0.69em;color:var(--sub);background:rgba(106,74,138,0.12);border:1px solid rgba(106,74,138,0.22);padding:1px 5px;white-space:nowrap;flex-shrink:0;}
.add-class-btn{margin:10px;padding:9px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.77em;letter-spacing:1px;text-align:center;transition:all .15s;white-space:nowrap;font-family:var(--font);}
.add-class-btn:hover,.add-class-btn.drag-over{border-color:var(--gold);color:var(--gold);}
.add-class-btn.drag-over{border-style:solid;background:rgba(184,152,42,0.07);}
.sidebar-author{padding:7px 10px 8px;font-size:0.65em;color:var(--text);letter-spacing:1px;border-top:1px solid var(--border);text-align:center;opacity:0.55;flex-shrink:0;white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .sidebar-author{display:none;}
.sidebar-rh{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:10;}
.sidebar-rh:hover,.sidebar-rh.active{background:rgba(184,152,42,0.25);}

/* MAIN */
.main{flex:1;overflow-y:auto;min-width:0;}

/* ACTION BAR */
.action-bar{display:flex;gap:6px;padding:7px 14px;border-bottom:1px solid var(--border);background:var(--sidebar-bg);align-items:center;flex-wrap:wrap;}
.action-bar-title{font-size:0.69em;letter-spacing:3px;color:var(--text);text-transform:uppercase;flex:1;font-weight:700;opacity:0.75;}
.act-btn{font-size:0.85em;padding:4px 10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font);}
.act-btn:hover{border-color:var(--gold);color:var(--gold);}
.act-btn.export{border-color:rgba(74,96,128,0.4);color:var(--accent);}
.act-btn.export:hover{border-color:var(--accent);background:rgba(74,96,128,0.1);}

/* CLASS HEADER */
.class-header{padding:20px 28px 14px;border-bottom:1px solid var(--border);}
.class-name-input{font-size:clamp(1em,2.5vw,2em);font-weight:700;color:var(--text);background:transparent;border:none;outline:none;width:100%;letter-spacing:1px;font-family:var(--font);}
.class-name-input::placeholder{color:var(--muted);}
.class-meta{display:flex;gap:10px;margin-top:4px;align-items:center;}
.class-desc-input{font-size:0.92em;font-style:italic;color:var(--muted);background:transparent;border:none;outline:none;flex:1;font-family:var(--font);}
.class-cat-input{font-size:0.77em;color:var(--accent);background:transparent;border:1px solid transparent;outline:none;width:110px;padding:1px 4px;font-family:var(--font);}
.class-cat-input:focus{border-color:var(--accent);}
.class-cat-input::placeholder{color:var(--muted);}
.hdr-line{width:100%;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:10px;}

/* LAYOUT */
.content-wrap{display:flex;align-items:flex-start;}
.content-left{flex:1;min-width:0;padding:18px 22px;}
.content-right{display:none!important;}
.content-right.no-transition{transition:none!important;}
.content-right.collapsed{width:36px!important;min-width:36px!important;}
.right-toggle-bar{display:flex;align-items:center;justify-content:flex-end;padding:10px 10px 6px;border-bottom:1px solid var(--border);background:var(--bg);z-index:2;}
.right-label{font-size:0.69em;letter-spacing:3px;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;flex:1;padding-left:2px;font-weight:700;}
.content-right.collapsed .right-label{opacity:0;}
.right-toggle{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:0.85em;padding:2px;flex-shrink:0;line-height:1;transition:color .15s;}
.right-toggle:hover{color:var(--gold);}
.right-inner{padding:0;}
.content-right.collapsed .right-inner{display:none;}
.right-rh{position:absolute;left:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:10;}
.right-rh:hover,.right-rh.active{background:rgba(184,152,42,0.25);}

.intro-save-btn{background:var(--gold);border:none;color:#0c0e18;font-size:0.82em;font-weight:700;padding:6px 16px;cursor:pointer;letter-spacing:1px;font-family:var(--font);}
.intro-save-btn:hover{background:var(--gold2);}
.intro-cancel-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:0.82em;padding:6px 12px;cursor:pointer;font-family:var(--font);transition:all .15s;}
.intro-cancel-btn:hover{border-color:var(--muted);color:var(--text);}
.custom-theme-del{position:absolute;top:-2px;right:-2px;background:rgba(180,60,60,0.9);border:none;color:#fff;font-size:0.65em;padding:1px 4px;cursor:pointer;display:none;line-height:1.4;z-index:2;font-family:var(--font);}
.theme-preset-cell:hover .custom-theme-del{display:block;}
.theme-preset-cell{position:relative;}
.sp-add-theme-btn{margin:4px 8px 6px;padding:5px 8px;background:transparent;border:1px dashed var(--border);color:var(--muted);font-size:0.75em;cursor:pointer;font-family:var(--font);width:calc(100% - 16px);transition:all .15s;letter-spacing:1px;text-align:center;}
.sp-add-theme-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ATTR PANEL */
.attr-title{font-size:0.85em;font-weight:700;text-align:center;padding:12px 10px 10px;color:var(--text);border-bottom:1px solid var(--border);}
.attr-field{border-bottom:1px solid rgba(37,40,64,0.4);}
.attr-field:last-child{border-bottom:none;}
.attr-lbl{text-align:right;font-size:0.72em;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:7px 10px 1px;}
.attr-val{width:100%;background:transparent;border:none;outline:none;font-size:0.95em;color:var(--text);resize:none;overflow:hidden;padding:2px 10px 8px;line-height:1.5;font-family:var(--font);box-sizing:border-box;}
.attr-val:focus{color:var(--gold2);}

/* SECTION */
.section{margin-bottom:26px;}
.section-title{font-size:0.69em;letter-spacing:4px;color:var(--muted);text-transform:uppercase;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:12px;font-weight:700;}

/* LEVEL TABLE */
.ltable-wrap{overflow-x:auto;}
table.ltable{border-collapse:collapse;border:1px solid var(--border);font-size:var(--table-fs);table-layout:fixed;width:100%;}
table.ltable th{font-size:0.65em;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:5px 14px 5px 4px;background:var(--panel2);border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:normal;word-break:break-word;overflow-wrap:break-word;text-align:center;position:relative;user-select:none;overflow:visible;font-family:var(--font);font-weight:700;}
table.ltable th[data-slot]{white-space:nowrap;word-break:normal;overflow-wrap:normal;}
table.ltable th:last-child{border-right:none;}
table.ltable th.grp-hdr{background:rgba(74,96,128,0.08);color:var(--accent);font-size:0.65em;border-bottom:1px solid rgba(74,96,128,0.2);}
table.ltable th.col-drag-over{background:rgba(184,152,42,0.15)!important;outline:2px solid var(--gold);}
table.ltable td{padding:4px 5px;background:var(--panel);border-bottom:1px solid rgba(37,40,64,0.4);border-right:1px solid rgba(37,40,64,0.3);vertical-align:top;overflow:hidden;font-size:0.9em;}
table.ltable td:last-child{border-right:none;}
table.ltable tr:last-child td{border-bottom:none;}
table.ltable tr:hover td{background:var(--panel2);}
table.ltable tr.tag-drag-over td{background:rgba(184,152,42,0.1)!important;outline:1px solid rgba(184,152,42,0.4);}
.lv-num{color:var(--muted);text-align:center;font-size:1em;font-weight:700;}
.lv-input{background:transparent;border:none;outline:none;font-size:1em;color:var(--gold);width:100%;text-align:center;font-family:var(--font);}
.lv-input:focus{color:var(--gold2);}
.lv-input.slot-input{color:var(--accent);}
.lv-input.slot-input:focus{color:var(--gold2);}
.feature-tags{display:flex;flex-wrap:wrap;gap:2px;}
.feature-tag{font-size:0.88em;padding:2px 5px;background:transparent;border:1px solid var(--accent);color:var(--accent);transition:all .15s;white-space:nowrap;font-family:var(--font);opacity:0.85;}
.feature-tag.sub-tag{opacity:0.85;}
.feature-tag[data-ab-id]{cursor:pointer;}
.feature-tag[data-ab-id]:hover{background:rgba(74,96,128,0.22);}
.feature-tag[data-ab-id].ft-highlight{box-shadow:0 0 0 2px var(--accent);}
@keyframes ab-flash{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:none;}}
.ab-jump-flash{animation:ab-flash 0.8s ease-out;}
.col-hdr-inner{display:flex;align-items:center;gap:2px;justify-content:center;overflow:hidden;}.del-col-btn{font-size:0.54em;color:var(--muted);cursor:pointer;padding:1px 2px;opacity:0.4;line-height:1;flex-shrink:0;}
.del-col-btn:hover{color:#c06060;opacity:1;}
.grp-del-btn{font-size:0.54em;color:var(--muted);cursor:pointer;padding:1px 3px;opacity:0.5;line-height:1;}
.grp-del-btn:hover{color:#c06060;opacity:1;}
.col-drag-handle{font-size:0.69em;color:var(--muted);cursor:grab;opacity:0.4;flex-shrink:0;}
.col-drag-handle:hover{opacity:1;color:var(--gold);}
.add-col-section{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.add-col-btn{padding:5px 10px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.69em;letter-spacing:1px;transition:all .15s;font-family:var(--font);}
.add-col-btn:hover{border-color:var(--gold);color:var(--gold);}
.tpl-section{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.tpl-label{font-size:0.69em;color:var(--muted);letter-spacing:1px;font-weight:700;}
.col-tpl-btn{padding:4px 9px;border:1px solid rgba(74,96,128,0.28);background:rgba(74,96,128,0.06);color:#7a9ab8;cursor:pointer;font-size:0.69em;letter-spacing:1px;transition:all .15s;font-family:var(--font);}
.col-tpl-btn:hover{background:rgba(74,96,128,0.16);border-color:rgba(74,96,128,0.5);}
.col-rh{position:absolute;right:0;top:0;bottom:0;width:4px;cursor:col-resize;background:transparent;}
.col-rh:hover,.col-rh.active{background:rgba(184,152,42,0.35);}

/* SUBCLASSES */
.sub-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.sub-tab{font-size:0.77em;letter-spacing:1px;padding:5px 12px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font);}
.sub-tab:hover{border-color:var(--sub);color:var(--sub);}
.sub-tab.active{border-color:var(--sub);color:var(--sub);background:rgba(106,74,138,0.08);}
.add-sub-btn{font-size:0.77em;letter-spacing:1px;padding:5px 10px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font);}
.add-sub-btn:hover{border-color:var(--sub);color:var(--sub);}
.sub-editor{background:var(--panel);border:1px solid var(--border);padding:12px;margin-bottom:10px;}
.sub-editor-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sub-name{font-size:0.85em;letter-spacing:2px;color:var(--sub);font-weight:700;cursor:text;}
.sub-name-inp{font-size:0.85em;letter-spacing:2px;font-weight:700;background:transparent;border:none;border-bottom:1px solid var(--sub);outline:none;color:var(--sub);font-family:var(--font);min-width:180px;}
.sub-del-btn{font-size:0.77em;padding:3px 8px;border:1px solid rgba(180,60,60,0.28);background:transparent;color:#a06060;cursor:pointer;font-family:var(--font);}
.sub-del-btn:hover{background:rgba(180,60,60,0.1);}
.sub-hint{font-size:0.69em;color:var(--muted);margin-bottom:8px;letter-spacing:1px;font-weight:700;}
.sub-lv-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.sub-lv-in{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;font-size:0.85em;width:50px;text-align:center;outline:none;font-family:var(--font);}
.sub-lv-in:focus{border-color:var(--sub);}
.sub-lv-name{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;font-size:0.92em;outline:none;font-family:var(--font);}
.sub-lv-name:focus{border-color:var(--sub);}
.tiny-btn{font-size:0.69em;padding:3px 7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font);}
.tiny-btn:hover{border-color:var(--gold);color:var(--gold);}
.tiny-btn.del:hover{border-color:#c06060;color:#c06060;}

/* ABILITIES */
.abilities-list{display:flex;flex-direction:column;gap:2px;}
.ability-card{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--border);}
.ability-header{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none;}
.ability-header:hover{background:rgba(255,255,255,0.02);}
.drag-handle{display:none;}
.ab-lv-badge{font-size:0.9em;color:var(--muted);background:var(--panel2);border:1px solid var(--border);min-width:26px;text-align:center;padding:2px 4px;flex-shrink:0;font-weight:700;}
.ab-toggle{font-size:0.69em;color:var(--muted);flex-shrink:0;transition:transform .15s;margin-left:auto;}
.ability-card.open .ab-toggle{transform:rotate(90deg);}
.ab-name-wrap{flex:1;min-width:60px;display:flex;flex-direction:column;gap:1px;overflow:hidden;}
.ab-name-disp{font-size:1em;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ab-name-edit{width:100%;background:transparent;border:none;border-bottom:1px solid var(--gold);outline:none;font-size:1em;font-weight:700;color:var(--gold2);font-family:var(--font);}
.ab-sl-hint-line{font-size:0.69em;color:var(--muted);font-style:italic;line-height:1.2;}
.ab-type-in{background:transparent;border:none;outline:none;font-size:0.85em;font-style:italic;color:var(--muted);width:90px;font-family:var(--font);cursor:text;}
.ab-type-in:focus{color:var(--gold2);}
.ab-sub-sel{background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:0.85em;padding:2px 4px;outline:none;font-family:var(--font);}
.ab-sub-sel:focus{border-color:var(--sub);}
.ab-btn{font-size:0.77em;padding:3px 6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font);}
.ab-btn:hover{border-color:var(--gold);color:var(--gold);}
.ab-btn.del:hover{border-color:#c06060;color:#c06060;}
.ability-body-wrap{display:none;padding:0 10px 10px 48px;}
.ability-card.open .ability-body-wrap{display:block;}

/* Rich text editor */
.ab-body-ce{width:100%;background:rgba(0,0,0,0.18);border:1px solid var(--border);outline:none;font-size:0.92em;color:#c8c0a8;line-height:1.7;padding:7px 10px;min-height:44px;font-family:var(--font);word-wrap:break-word;overflow-wrap:break-word;}
.ab-body-ce:focus{border-color:var(--gold);}
.ab-body-ce p{margin:0 0 2px 0;}
.ab-body-ce b,.ab-body-ce strong{color:var(--text);}
.ab-body-ce i,.ab-body-ce em{color:#b8b0a0;}
.ab-body-ce h3{font-size:1em;color:var(--gold);font-weight:700;margin:6px 0 2px;letter-spacing:1px;}
.ab-body-ce code{background:rgba(0,0,0,0.35);padding:1px 5px;font-family:monospace;font-size:0.88em;color:#90c890;}
.ab-body-ce ul,.ab-body-ce ol{padding-left:18px;margin:2px 0;}
.ab-body-ce li{margin:1px 0;}
.ab-body-ce hr{border:none;border-top:1px solid var(--border);margin:6px 0;}

/* Tables inside editor */
.ab-body-ce table.ce-table{border-collapse:collapse;margin:6px 0;width:100%;}
.ab-body-ce table.ce-table th,.ab-body-ce table.ce-table td{border:1px solid var(--border);padding:4px 8px;vertical-align:top;min-width:30px;}
.ab-body-ce table.ce-table th{background:var(--panel2);color:var(--gold);font-weight:700;font-size:0.88em;}
.ab-body-ce table.ce-table td{background:rgba(0,0,0,0.1);}
.ab-body-ce table.ce-table tr:hover td{background:rgba(255,255,255,0.04);}

/* Dice table */
.ab-body-ce table.dice-table th:first-child,.ab-body-ce table.dice-table td:first-child{color:var(--muted);width:56px;text-align:center;font-family:monospace;}
.ab-body-ce table.dice-table .dice-row-hit td{background:rgba(184,152,42,0.22)!important;color:var(--gold2)!important;}
@keyframes diceHit{0%{background:rgba(184,152,42,0.5)}100%{background:rgba(184,152,42,0.22)}}
.ab-body-ce table.dice-table .dice-row-hit td{animation:diceHit 0.35s ease-out forwards;}
.dice-roll-wrap{display:inline-flex;align-items:center;gap:6px;}
.dice-roll-btn{display:inline-block;background:rgba(184,152,42,0.12);border:1px solid rgba(184,152,42,0.35);color:var(--gold);padding:1px 7px;cursor:pointer;font-size:0.8em;user-select:none;transition:all .15s;border-radius:2px;}
.dice-roll-btn:hover{background:rgba(184,152,42,0.25);border-color:var(--gold);}
.dice-result-disp{font-size:0.8em;color:var(--gold2);min-width:30px;}

/* Floating format toolbar */
.ab-float-toolbar{position:fixed;display:none;background:var(--panel2);border:1px solid var(--border);box-shadow:0 4px 18px rgba(0,0,0,0.75);z-index:500;gap:2px;padding:3px 4px;align-items:center;}
.ab-float-toolbar.vis{display:flex;}
.ft-btn{background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:0.85em;padding:3px 7px;font-family:var(--font);transition:all .12s;min-width:28px;text-align:center;line-height:1.3;}
.ft-btn:hover{border-color:var(--border);color:var(--text);background:rgba(255,255,255,0.06);}
.ft-btn.on{color:var(--gold2);background:rgba(184,152,42,0.12);border-color:rgba(184,152,42,0.3);}
.ft-sep{width:1px;height:16px;background:var(--border);margin:0 2px;flex-shrink:0;}

/* Context menu */
.ab-ctx-menu{position:fixed;background:var(--panel2);border:1px solid var(--border);box-shadow:0 4px 18px rgba(0,0,0,0.75);z-index:600;min-width:170px;display:none;padding:4px 0;}
.ab-ctx-menu.vis{display:block;}
.ctx-item{padding:6px 14px;cursor:pointer;font-size:0.85em;color:var(--text);transition:background .1s;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.ctx-item:hover{background:rgba(184,152,42,0.1);color:var(--gold);}
.ctx-item.danger:hover{background:rgba(180,60,60,0.12);color:#c06060;}
.ctx-sep{height:1px;background:var(--border);margin:3px 0;}
.ctx-icon{width:16px;text-align:center;opacity:0.7;}

.add-ab-btn{margin-top:8px;padding:8px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.77em;letter-spacing:2px;transition:all .15s;width:100%;font-family:var(--font);}
.add-ab-btn:hover{border-color:var(--gold);color:var(--gold);}
.scale-ctrl{display:flex;align-items:center;gap:4px;}
.scale-val{font-size:0.77em;color:var(--muted);min-width:34px;text-align:center;}

/* Settings panel */
.settings-btn{font-size:0.92em;padding:4px 9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font);position:relative;}
.settings-btn:hover,.settings-btn.open{border-color:var(--gold);color:var(--gold);}
.settings-panel{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel2);border:1px solid var(--border);box-shadow:0 6px 24px rgba(0,0,0,0.7);z-index:400;min-width:220px;padding:8px 0;display:none;}
.settings-panel.vis{display:block;}
.sp-section{padding:6px 14px 2px;font-size:0.65em;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.sp-row{display:flex;align-items:center;gap:6px;padding:5px 14px;}
.sp-label{flex:1;font-size:0.82em;color:var(--text);}
.sp-val{font-size:0.77em;color:var(--muted);min-width:36px;text-align:center;}
.sp-btn{font-size:0.82em;padding:2px 8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s;}
.sp-btn:hover{border-color:var(--gold);color:var(--gold);}
.sp-sep{height:1px;background:var(--border);margin:5px 0;}
/* Color swatches in settings */
.sp-color-row{display:flex;align-items:center;gap:6px;padding:4px 14px;}
.sp-color-swatch{width:18px;height:18px;border-radius:2px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;transition:transform .12s,border-color .12s;}
.sp-color-swatch:hover{transform:scale(1.15);border-color:var(--gold);}
.sp-color-label{flex:1;font-size:0.82em;color:var(--text);}
.sp-reset-btn{font-size:0.72em;padding:2px 7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .12s;}
.sp-reset-btn:hover{border-color:#c06060;color:#c06060;}
.theme-preset-row{display:flex;gap:5px;padding:5px 14px 8px;align-items:center;}
.theme-preset-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px 14px 8px;}
.theme-preset-cell{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:3px;padding:3px 2px;transition:background .1s;}
.theme-preset-cell:hover{background:rgba(255,255,255,0.06);}
.theme-preset-cell:hover .theme-preset{transform:scale(1.1);border-color:var(--gold);}
.theme-preset{width:22px;height:22px;border-radius:3px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .12s,border-color .12s;}
.theme-preset-name{font-size:0.58em;color:var(--muted);text-align:center;white-space:nowrap;letter-spacing:0.3px;}
/* Foreground color grid in context menu */
.ctx-color-grid{display:grid;grid-template-columns:repeat(8,20px);gap:3px;padding:5px 10px;}
.ctx-color-dot{width:20px;height:20px;border-radius:2px;cursor:pointer;border:1px solid rgba(255,255,255,0.08);transition:transform .1s,border-color .1s;}
.ctx-color-dot:hover{transform:scale(1.15);border-color:var(--gold);}
.ctx-color-custom{padding:3px 14px 7px;font-size:0.8em;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;}
.ctx-color-custom:hover{color:var(--gold);}
/* input[type=color] used as swatches — reset browser chrome */
input[type=color].sp-color-swatch{-webkit-appearance:none;appearance:none;padding:0;}
input[type=color].sp-color-swatch::-webkit-color-swatch-wrapper{padding:0;border-radius:1px;}
input[type=color].sp-color-swatch::-webkit-color-swatch{border:none;border-radius:1px;}
input[type=color].cls-accent-dot{-webkit-appearance:none;appearance:none;padding:0;border:none;}
input[type=color].cls-accent-dot::-webkit-color-swatch-wrapper{padding:0;border-radius:1px;}
input[type=color].cls-accent-dot::-webkit-color-swatch{border:none;border-radius:1px;}
/* Per-class accent dot in header */
.cls-accent-dot{width:14px;height:14px;border-radius:2px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;transition:transform .12s;display:inline-block;vertical-align:middle;margin-left:4px;margin-right:2px;background:none;}
.cls-accent-dot:hover{transform:scale(1.2);border-color:var(--gold);}
/* Overlay color input trick — transparent input covering a button/label */
.color-input-overlay{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;padding:0;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel2);border:1px solid var(--gold);padding:24px;width:340px;max-width:90vw;}
.modal-title{font-size:1em;color:var(--gold);letter-spacing:2px;margin-bottom:14px;font-weight:700;}
.modal-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 11px;font-size:1em;outline:none;margin-bottom:10px;font-family:var(--font);}
.modal-input:focus{border-color:var(--gold);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.btn{font-size:0.77em;letter-spacing:1px;padding:7px 13px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font);}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-g{border-color:rgba(184,152,42,0.5);color:var(--gold);}
.btn-g:hover{background:rgba(184,152,42,0.1);}
.empty-state{text-align:center;padding:80px 20px;color:var(--muted);font-style:italic;}
.empty-state .big{font-size:32px;margin-bottom:14px;color:var(--border);}
body.col-resizing{cursor:col-resize!important;}
body.col-resizing *{cursor:col-resize!important;user-select:none!important;}
/* Мобильный блок атрибутов — скрыт на десктопе */
.mob-attr-block{display:block;}

/* ============================================================
   MOBILE — все изменения ниже. Десктоп (>768px) не затронут.
   ============================================================ */
@media (max-width:768px){
  /* Фиксированный топ-бар */
  #mob-topbar{display:flex!important;align-items:center;gap:8px;position:fixed;top:0;left:0;right:0;height:44px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);z-index:250;padding:0 12px;}
  #mob-menu-btn{background:transparent;border:none;color:var(--muted);font-size:1.3em;cursor:pointer;padding:6px;line-height:1;flex-shrink:0;}
  #mob-menu-btn:hover{color:var(--gold);}
  #mob-topbar-title{font-size:0.85em;letter-spacing:1px;color:var(--text);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Тёмная подложка под выдвинутый сайдбар */
  #mob-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:299;display:none;}
  #mob-overlay.vis{display:block;}
  /* Сдвигаем body вниз под топ-бар */
  body{padding-top:44px;}
  /* Сайдбар → выдвижной drawer */
  .sidebar{position:fixed!important;left:0!important;top:44px!important;bottom:0!important;height:calc(100dvh - 44px)!important;width:260px!important;min-width:260px!important;transform:translateX(-100%);transition:transform .25s;z-index:300;}
  .sidebar.mob-open{transform:translateX(0)!important;}
  /* Сбрасываем desktop-collapsed состояние на мобильном */
  .sidebar.collapsed{width:260px!important;min-width:260px!important;}
  .sidebar.collapsed .sidebar-label,.sidebar.collapsed .sidebar-search,.sidebar.collapsed .sidebar-body{display:flex!important;opacity:1!important;}
  .sidebar-rh{display:none!important;}
  #sb-toggle{display:none!important;}
  /* Основной контент на всю ширину */
  .main{width:100%;overflow-x:hidden;}
  /* Панели — вертикальный стек */
  .content-wrap{flex-direction:column;}
  .content-left{padding:12px 14px;}
  .content-right{width:100%!important;min-width:100%!important;position:static!important;max-height:none!important;border-left:none;border-top:1px solid var(--border);}
  .content-right.collapsed{width:100%!important;min-width:100%!important;}
  .content-right.collapsed .right-inner{display:block!important;}
  .right-rh,.right-toggle-bar .right-toggle{display:none!important;}
  .right-toggle-bar{position:static;}
  /* Экшн-бар */
  .action-bar{padding:6px 10px;gap:4px;}
  .action-bar-title{display:none;}
  /* Шапка класса */
  .class-header{padding:12px 14px 10px;}
  .class-name-input{font-size:1.2em;}
  .class-meta{flex-wrap:wrap;gap:6px;}
  /* Touch-цели ≥36px */
  .act-btn,.btn,.tiny-btn,.ab-btn,.add-col-btn,.col-tpl-btn,.add-ab-btn,.add-class-btn,.add-sub-btn,.sub-del-btn,.sp-btn,.sp-reset-btn{min-height:36px;}
  .class-item{padding:10px 8px;min-height:40px;}
  .class-item-del{opacity:1!important;}
  .cat-header{padding:8px 6px;}
  /* Плавающий тулбар */
  .ft-btn{min-width:40px;min-height:40px;font-size:1em;}
  /* Контекстное меню */
  .ctx-item{padding:12px 14px;font-size:0.95em;}
  .ctx-color-dot{width:26px;height:26px;}
  .ctx-color-grid{grid-template-columns:repeat(7,26px);gap:4px;}
  /* Панель настроек — остаётся absolute, только расширяем влево и ограничиваем высоту */
  .settings-panel{left:auto;right:0;min-width:260px;max-height:80dvh;overflow-y:auto;}
  .sp-color-swatch{width:24px;height:24px;}
  /* Атрибуты: на мобильном — после таблицы, правая колонка — скрыта */
  .mob-attr-block{display:block;}
  .content-right{display:none!important;}
  /* Таблица */
  .ltable-wrap{-webkit-overflow-scrolling:touch;}
  /* Редактор умений */
  .ability-body-wrap{padding-left:10px;}
  .sub-editor-top{flex-wrap:wrap;gap:6px;}
  /* Сетка слотов */
  .add-col-section,.tpl-section{flex-wrap:wrap;}
  /* Подклассы — горизонтальный скролл вместо переноса */
  .sub-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none;}
  .sub-bar::-webkit-scrollbar{display:none;}
  /* Заголовок секции подклассов убираем лишний отступ */
  .section{padding-top:10px;}
}

/* ============================================================
   COMPENDIUM
   ============================================================ */
#screen-compendium{display:none;flex-direction:column;width:100%;height:100vh;overflow:hidden;background:var(--bg);}
body.comp-mode>.sidebar,body.comp-mode>#mob-topbar,body.comp-mode>#mob-overlay{display:none!important;}
body.comp-mode>.main{display:none!important;}
body.comp-mode>#screen-compendium{display:flex!important;}

/* Nav button in sidebar */
.comp-nav-btn{display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(74,96,128,0.08);border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s;border:none;border-bottom:1px solid var(--border);border-left:2px solid transparent;color:var(--text);opacity:0.8;font-family:var(--font);width:100%;text-align:left;}
.comp-nav-btn:hover{background:rgba(74,96,128,0.2);border-left-color:var(--gold);color:var(--gold);opacity:1;}
.comp-nav-btn .cnb-label{font-size:0.78em;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;transition:opacity .15s;}
.sidebar.collapsed .cnb-label{opacity:0;}

/* Top toolbar */
.comp-topbar{display:flex;align-items:center;gap:5px;padding:7px 10px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.comp-back-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 10px;cursor:pointer;font-size:0.82em;font-family:var(--font);transition:all .15s;white-space:nowrap;flex-shrink:0;}
.comp-back-btn:hover{border-color:var(--gold);color:var(--gold);}
.comp-search-wrap{position:relative;flex:1;min-width:130px;}
.comp-search-inp{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 8px 5px 26px;font-size:0.85em;outline:none;font-family:var(--font);}
.comp-search-inp:focus{border-color:var(--gold);}
.comp-search-icon{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.8em;pointer-events:none;}
.comp-filter-inp{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 7px;font-size:0.82em;outline:none;font-family:var(--font);min-width:75px;max-width:120px;}
.comp-filter-sel{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 7px;font-size:0.82em;outline:none;font-family:var(--font);cursor:pointer;min-width:90px;}
.comp-filter-inp:focus,.comp-filter-sel:focus{border-color:var(--gold);}
.comp-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px;}
.comp-view-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 9px;cursor:pointer;font-size:0.75em;font-family:var(--font);letter-spacing:1px;transition:all .15s;white-space:nowrap;}
.comp-view-btn.active{border-color:var(--gold);color:var(--gold);}
.comp-search-go{background:var(--gold);border:none;color:#0c0e18;padding:5px 14px;cursor:pointer;font-family:var(--font);font-size:0.85em;font-weight:700;flex-shrink:0;}
.comp-add-btn{background:rgba(74,96,128,0.15);border:1px solid var(--accent);color:var(--accent);padding:5px 10px;cursor:pointer;font-size:0.82em;font-family:var(--font);white-space:nowrap;transition:all .15s;}
.comp-add-btn:hover{background:rgba(74,96,128,0.28);color:var(--gold2);}
.comp-export-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 10px;cursor:pointer;font-size:0.82em;font-family:var(--font);white-space:nowrap;transition:all .15s;}
.comp-export-btn:hover{border-color:var(--gold);color:var(--gold);}
.comp-drag-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 9px;cursor:pointer;font-size:0.75em;font-family:var(--font);white-space:nowrap;transition:all .15s;}
.comp-drag-btn.active{border-color:#c04444;color:#c04444;background:rgba(192,68,68,0.08);}
.comp-settings-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 8px;cursor:pointer;font-size:0.92em;transition:all .15s;flex-shrink:0;}
.comp-settings-btn:hover,.comp-settings-btn.active{border-color:var(--gold);color:var(--gold);}

/* Type legend */
.comp-type-legend{display:flex;flex-wrap:wrap;gap:8px;padding:6px 14px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:0.78em;flex-shrink:0;}
.comp-legend-item{display:flex;align-items:center;gap:4px;color:var(--muted);}
.comp-legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

/* Body */
.comp-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:0;}

/* Groups (Type view) */
.comp-group{margin-bottom:18px;}
.comp-group-label{display:flex;align-items:center;gap:7px;font-size:0.67em;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;padding:0 0 6px;border-bottom:2px solid;margin-bottom:6px;white-space:nowrap;}
.comp-group-label .cgl-icon{font-size:1.2em;line-height:1;}
.comp-group-entries{columns:260px 6;column-gap:0;}
.comp-empty-zone{padding:4px 6px;color:var(--muted);font-size:0.8em;font-style:italic;}
.comp-drop-zone{padding:6px 10px;color:var(--muted);font-size:0.78em;text-align:center;border:1px dashed var(--border);border-radius:3px;margin:2px;transition:all .15s;}
.comp-drop-zone.drag-over{background:rgba(184,152,42,0.1);border-color:var(--gold);color:var(--gold);}

/* Entries */
.comp-entry{display:flex;align-items:center;gap:6px;padding:4px 6px;background:transparent;cursor:pointer;transition:background .1s;user-select:none;min-width:0;border-radius:3px;break-inside:avoid;}
.comp-entry:hover{background:var(--panel2);}
.comp-entry.drag-over{background:rgba(184,152,42,0.1);outline:1px dashed rgba(184,152,42,0.45);}
.comp-entry.dragging{opacity:0.35;}
.comp-entry-icon{font-size:0.85em;flex-shrink:0;width:15px;text-align:center;opacity:0.85;}
.comp-entry-name{font-size:0.88em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.comp-entry-lvl{font-size:0.72em;color:var(--muted);flex-shrink:0;}

/* Flat list (Name/Level view) */
.comp-flat-list{display:flex;flex-direction:column;gap:0;}
.comp-alpha-hdr,.comp-level-hdr{padding:4px 6px;font-size:0.63em;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-top:10px;margin-bottom:2px;}
.comp-flat-list .comp-entry{border-bottom:1px solid rgba(37,40,64,0.25);border-radius:0;}

/* Detail view */
.comp-detail{display:flex;flex-direction:column;width:100%;}
.comp-detail-back{display:inline-flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:0.85em;font-family:var(--font);padding:0 0 10px 0;transition:color .15s;}
.comp-detail-back:hover{color:var(--gold);}
.comp-detail-head{background:var(--panel2);padding:12px 14px 10px;border:1px solid var(--border);}

/* LOAD / SAVE */
async function load(){
  try {
    const doc = await db.collection('data').doc('classes').get();
    if (doc.exists && doc.data() && doc.data().list) {
      classes = doc.data().list;
      classes.forEach(migrate);
      return;
    }
  } catch(e) { console.warn('Firestore load failed, trying localStorage:', e); }
  // Запасной вариант — localStorage (для первичной миграции данных)
  let raw = localStorage.getItem(SK_NEW) || localStorage.getItem(SK_OLD);
  if (raw) {
    classes = JSON.parse(raw);
    classes.forEach(migrate);
    if (isOwner) save(); // мигрируем в Firestore
    return;
  }
  classes = [];
}

function txtToHtml(s){
  // convert plain text with newlines to html paragraphs
  return s.split('\n').map(l=>{
    const t=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return t?`<p>${t}</p>`:'<p><br></p>';
  }).join('');
}

function migrate(c){
  if(!c.colGroups) c.colGroups=[];
  if(!c.colWidths) c.colWidths={};
  if(c.category===undefined) c.category='';
  if(!c.stats) c.stats={};
  if(!c.stats.mainStat) c.stats.mainStat=c.stats.atk||'';
  if(!c.stats.hpPerLv) c.stats.hpPerLv='';
  c.levels.forEach(l=>{ if(!l.custom)l.custom={}; if(!l.featureAbIds)l.featureAbIds=[]; });
  c.abilities.forEach(a=>{
    if(a.slvId===undefined)a.slvId=null;
    // migrate plain text body → HTML
    if(a.body && !a.body.trim().startsWith('<')){
      a.body=txtToHtml(a.body);
    }
  });
}
function save(){
  if (!isOwner) return;
  db.collection('data').doc('classes').set({list: classes}).catch(e => console.error('save failed:', e));
}
function getActive(){ return classes.find(c=>c.id===activeId)||null; }

/* RESIZE HANDLES */
let colResizing=null, sbResizing=false, sbStartX=0, sbStartW=0, rightResizing=false, rightStartX=0, rightStartW=0;
document.addEventListener('mousedown',e=>{
  const rh=e.target.closest('.col-rh');
  if(rh){ const th=rh.closest('th'); if(!th)return;
    const tbl=th.closest('table'); const cls2=getActive();
    if(tbl){
      // Save all trackable column widths to cls.colWidths so re-render keeps them pinned
      if(cls2){ if(!cls2.colWidths)cls2.colWidths={}; tbl.querySelectorAll('th[data-col]').forEach(t=>{ const col=t.dataset.col; if(col&&!col.startsWith('__')){ const w=parseInt(window.getComputedStyle(t).width,10); if(w>0&&!cls2.colWidths[col])cls2.colWidths[col]=w; } }); }
      // Pin ALL ths at current computed widths so nothing else moves
      tbl.querySelectorAll('th').forEach(t=>{ const w=parseInt(window.getComputedStyle(t).width,10); if(w>0)t.style.width=w+'px'; });
      // Free the table from its percentage constraint — it will grow/shrink with the resized column
      tbl.style.width='auto'; tbl.style.minWidth='0';
    }
    const startW=parseInt(window.getComputedStyle(th).width,10);
    colResizing={colId:th.dataset.col,startX:e.clientX,startW}; rh.classList.add('active'); document.body.classList.add('col-resizing'); e.preventDefault(); return; }
  if(e.target.id==='sidebar-rh'&&!sidebarOff){ const sb=document.getElementById('sidebar'); sbResizing=true; sbStartX=e.clientX; sbStartW=sb.offsetWidth; e.target.classList.add('active'); sb.classList.add('no-transition'); document.body.classList.add('col-resizing'); e.preventDefault(); return; }
  if(e.target.closest('.right-rh')&&!rightOff){ const r=document.querySelector('.content-right'); rightResizing=true; rightStartX=e.clientX; rightStartW=r.offsetWidth; e.target.closest('.right-rh').classList.add('active'); r.classList.add('no-transition'); document.body.classList.add('col-resizing'); e.preventDefault(); return; }
});
document.addEventListener('mousemove',e=>{
  if(colResizing){ const cls=getActive(); if(!cls)return; const dx=e.clientX-colResizing.startX; const nw=Math.max(24,colResizing.startW+dx); if(!cls.colWidths)cls.colWidths={}; cls.colWidths[colResizing.colId]=nw; const th=document.querySelector(`th[data-col="${CSS.escape(colResizing.colId)}"]`); if(th)th.style.width=nw+'px'; return; }
  if(sbResizing){ const dx=e.clientX-sbStartX; const w=Math.max(140,Math.min(500,sbStartW+dx)); const sb=document.getElementById('sidebar'); sb.style.width=w+'px'; sb.style.minWidth=w+'px'; layoutWidths.sidebar=w; return; }
  if(rightResizing){ const dx=rightStartX-e.clientX; const w=Math.max(160,Math.min(600,rightStartW+dx)); const r=document.querySelector('.content-right'); r.style.width=w+'px'; r.style.minWidth=w+'px'; layoutWidths.right=w; return; }
});
document.addEventListener('mouseup',()=>{
  if(colResizing){ const cls=getActive(); if(cls)save(); document.querySelectorAll('.col-rh.active').forEach(el=>el.classList.remove('active')); colResizing=null; document.body.classList.remove('col-resizing'); return; }
  if(sbResizing){ sbResizing=false; document.getElementById('sidebar').classList.remove('no-transition'); document.querySelectorAll('.sidebar-rh.active').forEach(el=>el.classList.remove('active')); document.body.classList.remove('col-resizing'); saveLayout(); return; }
  if(rightResizing){ rightResizing=false; document.querySelector('.content-right')?.classList.remove('no-transition'); document.querySelectorAll('.right-rh.active').forEach(el=>el.classList.remove('active')); document.body.classList.remove('col-resizing'); saveLayout(); requestAnimationFrame(autoHAll); return; }
});
window.addEventListener('resize',()=>requestAnimationFrame(autoHAll));

  };

   ================================================================ */

async function loadConfig() {
  try {
    const doc = await db.collection('data').doc('config').get();
    if (doc.exists && doc.data()) {
      const cfg = doc.data();
      if (cfg.customThemes) customThemes = cfg.customThemes;
      if (cfg.themeVars) { themeVars = cfg.themeVars; applyTheme(); }
    }
  } catch(e) { console.warn('Firestore loadConfig failed:', e); }
}

function _saveConfig() {
  if (!isOwner) return;
  db.collection('data').doc('config').set({
    customThemes: customThemes,
    themeVars: themeVars
  }).catch(e => console.error('_saveConfig failed:', e));
}

function fbLogin() {
  if (currentUser) {
    auth.signOut().then(() => location.reload());
  } else {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(() => location.reload()).catch(e => alert('Ошибка входа: ' + e.message));
  }
}

/* SYNC FEATURES */
function syncFeatures(cls){
  cls.levels.forEach(lv=>{ lv.features=[]; lv.featureAbIds=[]; lv.subFeatures=[]; });
  const sorted=[...cls.abilities].sort((a,b)=>a.lv-b.lv||((a.name||'').localeCompare(b.name||'','ru')));
  sorted.forEach(a=>{
    const lv=cls.levels.find(l=>l.lv===a.lv); if(!lv)return;
    if(a.subId){ if(activeSubId && a.subId===activeSubId) lv.subFeatures.push(a.name); }
    else{ lv.features.push(a.name); lv.featureAbIds.push(a.id); }
  });
  (cls.subLevels||[]).forEach(sl=>{
    if(!activeSubId) return; // без подкласса — не показываем
    if(sl.subId!==activeSubId) return; // только выбранный подкласс
    const lv=cls.levels.find(l=>l.lv===sl.lv); if(!lv)return;
    lv.features.push(sl.label||'');
    lv.featureAbIds.push(-sl.id);
  });
}

/* SIDEBAR RENDER */
function renderClassItem(c,cat){
  return `<div class="class-item${c.id===activeId?' active':''}" data-cls-id="${c.id}" data-cat="${esc(cat)}" draggable="true" onclick="selectClass(${c.id})">
    <span class="cls-file-icon">📄</span>

    <span class="class-item-del" onclick="event.stopPropagation();deleteClass(${c.id})">✕</span>
  </div>`;
}

function renderSidebar(){
  const query=(document.getElementById('sb-search')?.value||'').toLowerCase();
  let list=[...classes];
  if(query) list=list.filter(c=>c.name.toLowerCase().includes(query)||(c.category||'').toLowerCase().includes(query));
  if(sortAlpha) list=[...list].sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  const cats={};
  list.forEach(c=>{ const cat=c.category||''; if(!cats[cat])cats[cat]=[]; cats[cat].push(c); });
  const catKeys=Object.keys(cats).sort((a,b)=>{ if(!a)return 1; if(!b)return -1; return a.localeCompare(b,'ru'); });
  let html='';
  catKeys.forEach(cat=>{
    if(cat){
      const collapsed=collapsedCats.has(cat);
      html+=`<div class="cat-folder" data-cat="${esc(cat)}">
        <div class="cat-header${collapsed?' collapsed':''}" onclick="toggleCat('${esc(cat)}')">
          <span class="cat-chevron">▼</span>
          <span class="cat-folder-icon">📁</span>
          <span class="cat-name" ondblclick="event.stopPropagation();renameCatInline(this,'${esc(cat)}')">${esc(cat)}</span>
        </div>
        <div class="cat-children${collapsed?' hidden':''}">
          ${cats[cat].map(c=>renderClassItem(c,cat)).join('')}
        </div>
      </div>`;
    } else {
      html+=cats[cat].map(c=>renderClassItem(c,'')).join('');
    }
  });
  document.getElementById('class-list').innerHTML=html;
}

function toggleCat(cat){
  if(collapsedCats.has(cat)) collapsedCats.delete(cat);
  else collapsedCats.add(cat);
  renderSidebar();
}

function renameCatInline(el,oldCat){
  const inp=document.createElement('input');
  inp.className='cat-rename-inp'; inp.value=oldCat;
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{
    const newCat=inp.value.trim()||oldCat;
    if(newCat!==oldCat) classes.forEach(c=>{ if((c.category||'')===(oldCat))c.category=newCat; });
    save(); renderSidebar();
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape'){inp.value=oldCat;commit();} });
}

function initSidebarDrag(){
  const list=document.getElementById('class-list'); if(!list)return;
  list.addEventListener('dragstart',e=>{
    const item=e.target.closest('.class-item[draggable]'); if(!item)return;
    sbDragClsId=parseInt(item.dataset.clsId);
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',String(sbDragClsId));
    setTimeout(()=>item.style.opacity='0.4',0);
  },true);
  list.addEventListener('dragend',e=>{
    const item=e.target.closest('.class-item'); if(item)item.style.opacity='';
    list.querySelectorAll('.class-item.drag-over,.cat-header.drag-over').forEach(el=>el.classList.remove('drag-over'));
    sbDragClsId=null;
  },true);
  list.addEventListener('dragover',e=>{
    if(sbDragClsId==null)return;
    e.preventDefault(); // всегда разрешаем drop (нужно для выноса из папки)
    const item=e.target.closest('.class-item');
    const catHdr=e.target.closest('.cat-header');
    list.querySelectorAll('.class-item.drag-over,.cat-header.drag-over,.add-class-btn.drag-over').forEach(el=>el.classList.remove('drag-over'));
    if(item && parseInt(item.dataset.clsId)!==sbDragClsId) item.classList.add('drag-over');
    else if(catHdr) catHdr.classList.add('drag-over');
    // пустое место в сайдбаре — подсвечиваем кнопку "Добавить" как целевую зону
    else { const ab=list.querySelector('.add-class-btn')||list.parentElement?.querySelector('.add-class-btn'); if(ab) ab.classList.add('drag-over'); }
  });
  list.addEventListener('drop',e=>{
    if(sbDragClsId==null)return;
    list.querySelectorAll('.class-item.drag-over,.cat-header.drag-over,.add-class-btn.drag-over').forEach(el=>el.classList.remove('drag-over'));
    const srcCls=classes.find(c=>c.id===sbDragClsId);
    if(!srcCls){sbDragClsId=null;return;}
    const catHdr=e.target.closest('.cat-header');
    const item=e.target.closest('.class-item');
    if(catHdr){
      e.preventDefault();
      const newCat=catHdr.closest('.cat-folder')?.dataset.cat||'';
      srcCls.category=newCat;
      sbDragClsId=null; save(); renderSidebar(); return;
    }
    if(item){
      e.preventDefault();
      const tgtId=parseInt(item.dataset.clsId);
      if(tgtId===sbDragClsId){sbDragClsId=null;return;}
      const tgtCls=classes.find(c=>c.id===tgtId);
      if(!tgtCls){sbDragClsId=null;return;}
      srcCls.category=tgtCls.category||'';
      const si=classes.findIndex(c=>c.id===sbDragClsId);
      const [moved]=classes.splice(si,1);
      const newTi=classes.findIndex(c=>c.id===tgtId);
      classes.splice(newTi,0,moved);
      sbDragClsId=null; save(); renderSidebar(); return;
    }
    // Drop на пустое место — убираем из папки (category='')
    e.preventDefault();
    srcCls.category='';
    sbDragClsId=null; save(); renderSidebar();
  });
}

function delSubSpells(subId){
  const cls=getActive(); if(!cls)return;
  const deadGroups=(cls.colGroups||[]).filter(g=>g.subId===subId);
  deadGroups.forEach(g=>{ g.colIds.forEach(cid=>{ cls.customCols=cls.customCols.filter(c=>c.id!==cid); cls.levels.forEach(l=>{ if(l.custom)delete l.custom[cid]; }); if(cls.colWidths)delete cls.colWidths[cid]; }); });
  cls.colGroups=(cls.colGroups||[]).filter(g=>g.subId!==subId);
  cls.customCols=(cls.customCols||[]).filter(c=>!c.subId||c.subId!==subId);
  save(); renderMain();
}
function delColGroup(gid){
  const cls=getActive(); if(!cls)return;
  const grp=(cls.colGroups||[]).find(g=>g.id===gid); if(!grp)return;
  grp.colIds.forEach(cid=>{ cls.customCols=cls.customCols.filter(c=>c.id!==cid); cls.levels.forEach(l=>{ if(l.custom)delete l.custom[cid]; }); if(cls.colWidths)delete cls.colWidths[cid]; });
  cls.colGroups=cls.colGroups.filter(g=>g.id!==gid);
  save(); renderMain();
}
function delCol(cid){
  const cls=getActive(); if(!cls)return;
  const col=cls.customCols.find(c=>c.id===cid);
  if(col?.groupId){ const grp=(cls.colGroups||[]).find(g=>g.id===col.groupId); if(grp)grp.colIds=grp.colIds.filter(id=>id!==cid); }
  cls.customCols=cls.customCols.filter(c=>c.id!==cid);
  cls.levels.forEach(l=>{ if(l.custom)delete l.custom[cid]; });
  if(cls.colWidths)delete cls.colWidths[cid];
  save(); renderMain();
}

/* TABLE RENDER */
function colW(cls,colId,def){
  const w=(cls.colWidths||{})[colId];
  return w?`style="width:${w}px"`:(def?`style="width:${def}px"`:'');
}
function buildGroupRow(casterCols,groups){
  const result=[]; let i=0;
  while(i<casterCols.length){
    const col=casterCols[i];
    if(col.groupId){ const grp=groups.find(g=>g.id===col.groupId); if(grp){ let span=0,j=i; while(j<casterCols.length&&casterCols[j].groupId===col.groupId){span++;j++;} result.push({type:'group',name:grp.name,id:grp.id,span}); i+=span; continue; } }
    result.push({type:'solo',span:1}); i++;
  }
  return result;
}

function renderTable(cls){
  const cw=cls.colWidths||{};
  const normalCols=(cls.customCols||[]).filter(c=>!c.groupId && (!c.subId || c.subId===activeSubId));
  const casterCols=(cls.customCols||[]).filter(c=>c.groupId && (!c.subId || c.subId===activeSubId));
  const groups=(cls.colGroups||[]).filter(g=>!g.subId || g.subId===activeSubId);
  const groupRow=buildGroupRow(casterCols,groups);
  const hasGroups=groupRow.some(c=>c.type==='group');
  const fixedCount=2+1+normalCols.length;
  const rh=`<div class="col-rh"></div>`;
  const thead=`<thead>
    ${hasGroups?`<tr>
      <th colspan="${fixedCount}" data-col="__fixed"></th>
      ${groupRow.map(c=>c.type==='group'
        ?`<th class="grp-hdr" colspan="${c.span}" data-col="__grp_${c.id}"><div class="col-hdr-inner">${esc(c.name)}<span class="grp-del-btn" onclick="delColGroup('${c.id}')">✕</span></div></th>`
        :`<th data-col="__solo"></th>`
      ).join('')}
    </tr>`:''}
    <tr>
      <th data-col="lv" ${colW(cls,'lv',30)}>Ур.${rh}</th>
      <th data-col="prof" ${colW(cls,'prof',36)}>БВ${rh}</th>
      <th data-col="features" style="width:${cw['features']||180}px">Классовые умения${rh}</th>
      ${normalCols.map(c=>`<th data-col="${c.id}" ${colW(cls,c.id,70)} draggable="true"><div class="col-hdr-inner"><span class="col-drag-handle">⠿</span><span class="col-hdr-name" ondblclick="renameCol('${c.id}',this)">${esc(c.name)}</span><span class="del-col-btn" onclick="delCol('${c.id}')">✕</span></div>${rh}</th>`).join('')}
      ${casterCols.map(c=>`<th data-col="${c.id}" ${c.isSlot?'data-slot':''} ${colW(cls,c.id,c.isSlot?0:60)}><div class="col-hdr-inner">${esc(c.name)}</div>${rh}</th>`).join('')}
    </tr>
  </thead>`;
  const tbody=`<tbody>${cls.levels.map(lv=>renderLvRow(cls,lv,normalCols,casterCols)).join('')}</tbody>`;
  // If user has resized columns, fix table total width so columns don't redistribute
  const hasSavedWidths=Object.keys(cw).length>0;
  const tblStyle=hasSavedWidths?'style="width:auto;min-width:0"':'';
  return `<table class="ltable" ${tblStyle}>${thead}${tbody}</table>`;
}

function renderLvRow(cls,lv,normalCols,casterCols){
  const normCells=normalCols.map(c=>{
    const v=(lv.custom||{})[c.id]||'';
    return `<td><input class="lv-input" value="${esc(v)}" oninput="updLvCustom(${lv.lv},'${c.id}',this.value)"></td>`;
  }).join('');
  const castCells=casterCols.map(c=>{
    const v=(lv.custom||{})[c.id]||'';
    return `<td><input class="lv-input slot-input" value="${esc(v)}" oninput="updLvCustom(${lv.lv},'${c.id}',this.value)"></td>`;
  }).join('');
  const featureAbIds=lv.featureAbIds||[];
  const accentColor=cls.accentColor||null;
  const tags=(lv.features||[]).map((f,fi)=>{
    const abId=featureAbIds[fi];
    if(abId!=null && abId>0){
      const s=accentColor?`background:${accentColor}1a;border-color:${accentColor}44;color:${accentColor};`:'';
      return `<span class="feature-tag" draggable="true" data-ab-id="${abId}" style="${s}">${esc(f)}</span>`;
    } else if(abId!=null && abId<0){
      const sl=(cls.subLevels||[]).find(x=>x.id===-abId);
      const sub=sl?(cls.subclasses||[]).find(s=>s.id===sl.subId):null;
      const sc=sub?.color||null;

/* CE body save */
let ceSaveTimer=null;
function debounceSaveCe(el,id){
  clearTimeout(ceSaveTimer);
  ceSaveTimer=setTimeout(()=>saveCeBody(el,id),600);
}
function saveCeBody(el,id){
  clearTimeout(ceSaveTimer);
  const cls=getActive(); if(!cls)return;
  const a=cls.abilities.find(x=>x.id===id); if(!a)return;
  a.body=el.innerHTML;
  save();
}

function ceKeydown(e){
  // Tab = indent (insert 4 spaces as text, don't lose focus)
  if(e.key==='Tab'){
    e.preventDefault();
    document.execCommand('insertText',false,'    ');
  }
}

function abHeaderClick(e,id){
  if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName)) return;
  if(e.target.classList.contains('ab-body-ce')||e.target.closest('.ab-body-ce')) return;
  if(e.target.classList.contains('ab-name-disp')){
    clearTimeout(abClickTimer);
    abClickTimer=setTimeout(()=>{ abClickTimer=null; toggleAb(id); },230);
    return;
  }
  if(e.target.classList.contains('ab-name-edit')) return;
  toggleAb(id);
}

function editAbName(el,id){
  clearTimeout(abClickTimer); abClickTimer=null;
  const cls=getActive(); if(!cls)return;
  const a=cls.abilities.find(x=>x.id===id); if(!a)return;
  const inp=document.createElement('input');
  inp.className='ab-name-edit'; inp.value=a.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{
    const v=inp.value.trim()||a.name;
    a.name=v; save();
    const span=document.createElement('span');
    span.className='ab-name-disp';
    span.ondblclick=ev=>{ ev.stopPropagation(); editAbName(span,id); };
    span.textContent=v;
    inp.replaceWith(span);
    reTable();
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape'){inp.value=a.name;commit();} });
}

/* UPDATE HELPERS */
function upd(key,val){
  const cls=getActive(); if(!cls)return; cls[key]=val;
  if(key==='name'){ renderSidebar(); const t=document.querySelector('.attr-title'); if(t)t.textContent='Ключевые атрибуты · '+val; }
  if(key==='category') renderSidebar();
  save();
}
function updStat(key,val){ const cls=getActive(); if(!cls)return; if(!cls.stats)cls.stats={}; cls.stats[key]=val; save(); }
function updLv(lv,key,val){ const cls=getActive(); if(!cls)return; const row=cls.levels.find(l=>l.lv===lv); if(row){row[key]=val;save();} }
function updLvCustom(lv,cid,val){ const cls=getActive(); if(!cls)return; const row=cls.levels.find(l=>l.lv===lv); if(row){if(!row.custom)row.custom={};row.custom[cid]=val;save();} }
function updAb(id,key,val){
  const cls=getActive(); if(!cls)return;
  const a=cls.abilities.find(x=>x.id===id); if(!a)return;
  a[key]=val;
  if(key==='lv'||key==='name'||key==='subId'){syncFeatures(cls);reTable();}
  save();
  if(key==='lv'){ const list=document.getElementById('abilities-list'); if(list){list.innerHTML=renderAbilities(cls);} }
}
function toggleAb(id){
  const cls=getActive(); if(!cls)return;
  const a=cls.abilities.find(x=>x.id===id); if(a)a.open=!a.open; save();
  document.querySelector(`.ability-card[data-id="${id}"]`)?.classList.toggle('open');
}
function addAbility(){
  const cls=getActive(); if(!cls)return;
  const id=Date.now();
  cls.abilities.push({id,lv:1,name:'Новое умение',type:'Пассивная',subId:null,body:'',open:true,slvId:null});
  syncFeatures(cls); save();
  const list=document.getElementById('abilities-list');
  if(list){list.innerHTML=renderAbilities(cls);}
  reTable();
  setTimeout(()=>{
    const card=document.querySelector(`.ability-card[data-id="${id}"]`);
    if(card){card.scrollIntoView({behavior:'smooth',block:'center'});}
  },100);
}
function delAb(id){
  const cls=getActive(); if(!cls)return;
  cls.abilities=cls.abilities.filter(a=>a.id!==id);
  syncFeatures(cls); save();
  document.querySelector(`.ability-card[data-id="${id}"]`)?.remove();
  reTable();
}
function reTable(){
  const cls=getActive(); if(!cls)return;
  syncFeatures(cls);
  const wrap=document.getElementById('ltable-wrap');
  if(wrap){wrap.innerHTML=renderTable(cls);setupTableDrag();setupColHeaderDrag();}
}

function selectSub(id){ activeSubId=id; renderMain(); }
function deleteSub(id){
  const cls=getActive(); if(!cls)return;
  if(!confirm('Удалить подкласс и все его умения?'))return;
  cls.subclasses=cls.subclasses.filter(s=>s.id!==id);
  cls.subLevels=(cls.subLevels||[]).filter(sl=>sl.subId!==id);
  cls.abilities=cls.abilities.filter(a=>a.subId!==id);
  const deadGrps=(cls.colGroups||[]).filter(g=>g.subId===id);
  deadGrps.forEach(g=>{ g.colIds.forEach(cid=>{ cls.levels.forEach(l=>{ if(l.custom)delete l.custom[cid]; }); if(cls.colWidths)delete cls.colWidths[cid]; }); });
  cls.customCols=(cls.customCols||[]).filter(c=>!c.subId||c.subId!==id);
  cls.colGroups=(cls.colGroups||[]).filter(g=>!g.subId||g.subId!==id);
  if(activeSubId===id)activeSubId=null;
  syncFeatures(cls); save(); renderMain();
}
function addSubLv(subId){
  const cls=getActive(); if(!cls)return;
  if(!cls.subLevels)cls.subLevels=[];
  const slId=Date.now();
  const defaultLv=3;
  cls.subLevels.push({id:slId,subId,lv:defaultLv,label:''});
  const abId=Date.now()+1;
  cls.abilities.push({id:abId,lv:defaultLv,name:'Умение подкласса',type:'Пассивная',subId,body:'',open:false,slvId:slId});
  syncFeatures(cls); save(); renderMain();
}
function updateSubLv(id,key,val){
  const cls=getActive(); if(!cls)return;
  const sl=(cls.subLevels||[]).find(x=>x.id===id); if(!sl)return;
  sl[key]=val;
  const ab=cls.abilities.find(a=>a.slvId===id);
  if(key==='lv' && ab) ab.lv=val;
  if(key==='label' && ab) ab.name=val||'Умение подкласса';
  syncFeatures(cls); save(); reTable();
}
function deleteSubLv(id){
  const cls=getActive(); if(!cls)return;
  cls.subLevels=(cls.subLevels||[]).filter(sl=>sl.id!==id);
  cls.abilities=cls.abilities.filter(a=>a.slvId!==id);
  syncFeatures(cls); save(); renderMain();
}


/* SUBCLASS RENAME */
function startSubRename(id, el){
  const cls=getActive(); if(!cls)return;
  const sub=(cls.subclasses||[]).find(s=>s.id===id); if(!sub)return;
  const sc=sub.color||null;
  const inp=document.createElement('input');
  inp.className='sub-name-inp';
  inp.value=sub.name;
  if(sc) inp.style.color=sc, inp.style.borderBottomColor=sc;
  el.replaceWith(inp);
  inp.focus(); inp.select();
  const finish=()=>{
    const v=inp.value.trim();
    if(v) sub.name=v;
    save();
    renderMain();
  };
  inp.addEventListener('blur',finish);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    if(e.key==='Escape'){inp.value=sub.name;inp.blur();}
  });
}

/* JUMP TO ABILITY (compendium link) */
function jumpToAbility(abId){
  const cls=getActive(); if(!cls)return;
  const ab=cls.abilities.find(a=>a.id===abId);
  if(!ab)return;

  if(!ab.open){ ab.open=true; save(); const list=document.getElementById('abilities-list'); if(list)list.innerHTML=renderAbilities(cls); }

/* TABLE FEATURE TAG DRAG */
let tagDragAbId=null;
let _tagClickStart=null;
function setupTableDrag(){
  const wrap=document.getElementById('ltable-wrap'); if(!wrap)return;
  wrap.addEventListener('mousedown',e=>{
    const tag=e.target.closest('.feature-tag[data-ab-id]'); if(!tag)return;
    _tagClickStart={x:e.clientX,y:e.clientY,id:parseInt(tag.dataset.abId)};
  });
  wrap.addEventListener('click',e=>{
    const tag=e.target.closest('.feature-tag[data-ab-id]'); if(!tag)return;
    if(_tagClickStart && Math.abs(e.clientX-_tagClickStart.x)<5 && Math.abs(e.clientY-_tagClickStart.y)<5){
      jumpToAbility(_tagClickStart.id);
    }
    _tagClickStart=null;
  });
  wrap.addEventListener('dragstart',e=>{
    const tag=e.target.closest('.feature-tag[data-ab-id]'); if(!tag)return;
    tagDragAbId=parseInt(tag.dataset.abId); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(tagDragAbId)); tag.style.opacity='0.4';
  });
  wrap.addEventListener('dragend',e=>{ const tag=e.target.closest('.feature-tag'); if(tag)tag.style.opacity=''; document.querySelectorAll('tr.tag-drag-over').forEach(r=>r.classList.remove('tag-drag-over')); tagDragAbId=null; });
  wrap.addEventListener('dragover',e=>{ if(tagDragAbId==null)return; const tr=e.target.closest('tr[data-lv]'); if(!tr)return; e.preventDefault(); document.querySelectorAll('tr.tag-drag-over').forEach(r=>r.classList.remove('tag-drag-over')); tr.classList.add('tag-drag-over'); });
  wrap.addEventListener('drop',e=>{
    if(tagDragAbId==null)return; const tr=e.target.closest('tr[data-lv]'); if(!tr)return; e.preventDefault();
    document.querySelectorAll('tr.tag-drag-over').forEach(r=>r.classList.remove('tag-drag-over'));
    const newLv=parseInt(tr.dataset.lv); const cls=getActive(); if(!cls)return;
    const ab=cls.abilities.find(a=>a.id===tagDragAbId); if(!ab)return;
    ab.lv=newLv; tagDragAbId=null;
    syncFeatures(cls); save();
    reTable();
    const list=document.getElementById('abilities-list');
    if(list){list.innerHTML=renderAbilities(cls);}
  });
}

/* COLUMN HEADER DRAG */
let headerDragColId=null;
function setupColHeaderDrag(){
  const wrap=document.getElementById('ltable-wrap'); if(!wrap)return;
  const table=wrap.querySelector('table'); if(!table)return;
  const ths=table.querySelectorAll('th[draggable="true"]');
  ths.forEach(th=>{
    th.addEventListener('dragstart',e=>{
      if(e.target!==th&&!e.target.classList.contains('col-drag-handle')&&!e.target.closest('.col-hdr-inner'))return;
      headerDragColId=th.dataset.col;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain','col:'+headerDragColId);
      th.style.opacity='0.5';
    });
    th.addEventListener('dragend',()=>{ th.style.opacity=''; document.querySelectorAll('th.col-drag-over').forEach(t=>t.classList.remove('col-drag-over')); headerDragColId=null; });
    th.addEventListener('dragover',e=>{
      if(!headerDragColId||headerDragColId===th.dataset.col)return;
      e.preventDefault(); e.stopPropagation();
      document.querySelectorAll('th.col-drag-over').forEach(t=>t.classList.remove('col-drag-over'));
      th.classList.add('col-drag-over');
    });
    th.addEventListener('drop',e=>{
      if(!headerDragColId||headerDragColId===th.dataset.col)return;
      e.preventDefault(); e.stopPropagation();
      th.classList.remove('col-drag-over');
      const cls=getActive(); if(!cls)return;
      const srcId=headerDragColId, tgtId=th.dataset.col;
      const normalIds=cls.customCols.filter(c=>!c.groupId).map(c=>c.id);
      const si=normalIds.indexOf(srcId), ti=normalIds.indexOf(tgtId);
      if(si<0||ti<0)return;
      const srcIdx=cls.customCols.findIndex(c=>c.id===srcId);
      const tgtIdx=cls.customCols.findIndex(c=>c.id===tgtId);
      if(srcIdx<0||tgtIdx<0)return;
      const [moved]=cls.customCols.splice(srcIdx,1);
      const newTgtIdx=cls.customCols.findIndex(c=>c.id===tgtId);
      cls.customCols.splice(newTgtIdx,0,moved);
      headerDragColId=null;
      save(); reTable();
    });
  });
}

/* Floating toolbar */
function execFmt(cmd,val){
  document.execCommand(cmd,false,val||null);
  updateFtbState();
}

function wrapSelectionTag(tag){
  const sel=window.getSelection(); if(!sel||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);
  const el=document.createElement(tag);
  try{ range.surroundContents(el); } catch(e){ el.appendChild(range.extractContents()); range.insertNode(el); }
  // save
  const ce=el.closest('.ab-body-ce'); if(ce){ const id=parseInt(ce.dataset.id); saveCeBody(ce,id); }
}

function updateFtbState(){
  document.getElementById('ftb-bold')?.classList.toggle('on',document.queryCommandState('bold'));
  document.getElementById('ftb-italic')?.classList.toggle('on',document.queryCommandState('italic'));
  document.getElementById('ftb-under')?.classList.toggle('on',document.queryCommandState('underline'));
  document.getElementById('ftb-strike')?.classList.toggle('on',document.queryCommandState('strikeThrough'));
}

function hideFloatToolbar(){
  document.getElementById('float-toolbar').classList.remove('vis');
}

document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection();
  const tb=document.getElementById('float-toolbar');
  if(!sel||sel.isCollapsed||!sel.rangeCount){
    // small delay to not hide when clicking toolbar button
    setTimeout(()=>{
      const sel2=window.getSelection();
      if(!sel2||sel2.isCollapsed) hideFloatToolbar();
    },150);
    return;
  }
  // check selection is inside a CE div
  const range=sel.getRangeAt(0);
  const container=range.commonAncestorContainer;
  const ce=container.nodeType===1?container.closest('.ab-body-ce'):(container.parentElement?.closest('.ab-body-ce'));
  if(!ce){ hideFloatToolbar(); return; }

  // position toolbar above selection
  const rect=range.getBoundingClientRect();
  if(!rect.width&&!rect.height){ hideFloatToolbar(); return; }
  tb.classList.add('vis');
  const tbW=tb.offsetWidth||160;
  let x=rect.left+rect.width/2-tbW/2;
  let y=rect.top-tb.offsetHeight-6;
  if(x<4)x=4;
  if(x+tbW>window.innerWidth-4)x=window.innerWidth-tbW-4;
  if(y<4)y=rect.bottom+6;
  tb.style.left=x+'px';
  tb.style.top=y+'px';
  updateFtbState();
});

/* CE insert helpers */
function insertCeHr(){
  document.execCommand('insertHTML',false,'<hr>');
  saveCeIfActive();
}

function saveCeIfActive(){
  if(activeCeEl){ const id=parseInt(activeCeEl.dataset.id); if(id)saveCeBody(activeCeEl,id); }
}

function getCeTable(e){
  // find the table related to last ctx event — use ctxCeEl + saved target
  return ctxCeEl?.querySelector('table.ce-table:focus-within') || ctxCeEl?.querySelector('table.ce-table');
}

function promptInsertTable(){
  hideCtxMenu();
  const rows=parseInt(prompt('Строки:','3')||'3');
  const cols=parseInt(prompt('Столбцы:','3')||'3');
  if(!rows||!cols||rows<1||cols<1)return;
  insertCeTable(rows,cols,false);
}
function promptInsertDiceTable(){
  hideCtxMenu();
  const die=prompt('Кость (например d6, d20):','d6');
  if(!die)return;
  insertDiceTable(die.trim());
}

function insertCeTable(rows,cols,isDice){
  if(!activeCeEl)return;
  activeCeEl.focus();
  const cls=isDice?'ce-table dice-table':'ce-table';
  const diceAttr=isDice?` data-dice="${esc(arguments[2]||'d6')}"`:'' ;
  let html=`<table class="${cls}"${isDice?` data-dice="${arguments[2]||'d6'}"`:''}>`;
  // header row
  html+='<thead><tr>';
  for(let c=0;c<cols;c++) html+=`<th contenteditable="true">${isDice&&c===0?'Бросок':('Колонка '+(c+1))}</th>`;
  html+='</tr></thead>';
  html+='<tbody>';
  for(let r=0;r<rows;r++){
    if(isDice) html+=`<tr data-min="${r+1}" data-max="${r+1}">`;
    else html+='<tr>';
    for(let c=0;c<cols;c++) html+=`<td contenteditable="true">${isDice&&c===0?(r+1):'&nbsp;'}</td>`;
    html+='</tr>';
  }
  html+='</tbody></table><p><br></p>';
  document.execCommand('insertHTML',false,html);
  // if dice table, add roll button in header first cell
  if(isDice){
    setTimeout(()=>{
      activeCeEl.querySelectorAll('table.dice-table').forEach(t=>{
        const firstTh=t.querySelector('thead th');
        if(firstTh&&!firstTh.querySelector('.dice-roll-btn')){
          const d=t.dataset.dice||'d6';
          firstTh.innerHTML=`<div class="dice-roll-wrap">${esc(d)} <span class="dice-roll-btn" onclick="rollCeDice(this)">🎲 Бросок</span> <span class="dice-result-disp"></span></div>`;
        }
      });
      saveCeIfActive();
    },50);
  } else {
    saveCeIfActive();
  }
}

function insertDiceTable(die){
  if(!activeCeEl)return;
  activeCeEl.focus();
  const sides=parseInt(die.replace(/[^0-9]/g,''))||6;
  let html=`<table class="ce-table dice-table" data-dice="${esc(die)}">`;
  html+=`<thead><tr><th contenteditable="false"><div class="dice-roll-wrap">${esc(die)} <span class="dice-roll-btn" onclick="rollCeDice(this)">🎲 Бросок</span> <span class="dice-result-disp"></span></div></th><th contenteditable="true">Результат</th></tr></thead>`;
  html+='<tbody>';
  for(let i=1;i<=sides;i++) html+=`<tr data-min="${i}" data-max="${i}"><td contenteditable="true">${i}</td><td contenteditable="true">&nbsp;</td></tr>`;
  html+='</tbody></table><p><br></p>';
  document.execCommand('insertHTML',false,html);
  saveCeIfActive();
}

/* Dice roll */
function rollCeDice(btn){
  const table=btn.closest('table.dice-table'); if(!table)return;
  const die=table.dataset.dice||'d6';
  const sides=parseInt(die.replace(/[^0-9]/g,''))||6;
  const roll=Math.floor(Math.random()*sides)+1;
  // show result
  const disp=btn.parentElement?.querySelector('.dice-result-disp');
  if(disp) disp.textContent='= '+roll;
  // clear previous hit
  table.querySelectorAll('tr.dice-row-hit').forEach(r=>r.classList.remove('dice-row-hit'));
  // find matching row
  table.querySelectorAll('tbody tr').forEach(tr=>{
    const mn=parseInt(tr.dataset.min)||0, mx=parseInt(tr.dataset.max)||mn;
    if(roll>=mn&&roll<=mx) tr.classList.add('dice-row-hit');
  });
}

/* Table manipulation — operate on focused/last-ctx table */
function getCtxTable(){
  // try to find table inside ctxCeEl near current selection
  if(!ctxCeEl)return null;
  const sel=window.getSelection();
  if(sel&&sel.rangeCount){
    let node=sel.getRangeAt(0).startContainer;
    while(node&&node!==ctxCeEl){
      if(node.tagName==='TABLE') return node;
      node=node.parentElement;
    }
  }
  return ctxCeEl.querySelector('table.ce-table');
}

function ceTableAddRow(e){
  const t=getCtxTable(); if(!t)return;
  const cols=t.rows[0]?.cells.length||1;
  const row=t.insertRow(-1);
  for(let i=0;i<cols;i++){
    const td=row.insertCell(-1);
    td.setAttribute('contenteditable','true');
    td.innerHTML='&nbsp;';
  }
  saveCeIfActive();
}
function ceTableAddCol(e){
  const t=getCtxTable(); if(!t)return;
  for(let r=0;r<t.rows.length;r++){
    const row=t.rows[r];
    const cell=r===0?document.createElement('th'):document.createElement('td');
    cell.setAttribute('contenteditable','true');
    cell.innerHTML='&nbsp;';
    row.appendChild(cell);
  }
  saveCeIfActive();
}
function ceTableDelRow(e){
  const t=getCtxTable(); if(!t)return;
  const sel=window.getSelection();
  let rowIdx=t.rows.length-1;
  if(sel&&sel.rangeCount){
    let node=sel.getRangeAt(0).startContainer;
    while(node&&node!==t){ if(node.tagName==='TR'){rowIdx=node.rowIndex;break;} node=node.parentElement; }
  }
  if(t.rows.length>1) t.deleteRow(rowIdx);
  saveCeIfActive();
}
function ceTableDelCol(e){
  const t=getCtxTable(); if(!t)return;
  const sel=window.getSelection();
  let colIdx=0;
  if(sel&&sel.rangeCount){
    let node=sel.getRangeAt(0).startContainer;
    while(node&&node!==t){ if(node.tagName==='TD'||node.tagName==='TH'){colIdx=node.cellIndex;break;} node=node.parentElement; }
  }
  const cols=t.rows[0]?.cells.length||1;
  if(cols>1) for(let r=0;r<t.rows.length;r++) t.rows[r].deleteCell(colIdx);
  saveCeIfActive();
}
function ceTableDelete(e){
  const t=getCtxTable(); if(!t)return;
  t.remove();
  saveCeIfActive();
}
